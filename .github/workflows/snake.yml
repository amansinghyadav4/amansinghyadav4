# ─────────────────────────────────────────────────────────────────────────────
#  Generates the contribution-snake animation used in README.md
#  Lives at: .github/workflows/snake.yml
#
#  Writes two SVGs to the `output` branch — a dark variant and a light one —
#  which the <picture> block in README.md swaps between by colour scheme.
#  Runs on every push to main, daily at 03:17 UTC, or manually from Actions.
#
#  Palette matches the README: blue grid (#58A6FF ramp) with a teal snake
#  (#2DD4BF) moving through it. The light variant uses darker blues/teal so it
#  stays readable on GitHub's white background.
# ─────────────────────────────────────────────────────────────────────────────
name: Generate contribution snake

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Render snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#0D9488&color_dots=#EBEDF0,#C6DCF8,#8CBAF0,#4E92E8,#1F6FEB
            dist/github-contribution-grid-snake-dark.svg?color_snake=#2DD4BF&color_dots=#161B22,#0D2E5C,#1F5FA9,#3A85E0,#58A6FF

      - name: Publish to `output` branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
